name: APK de prueba

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar ilustraciones de inicio
        run: |
          DRAWING=app/src/main/res/drawable-nodpi/start_drawing.webp
          ANIMATION=app/src/main/res/drawable-nodpi/start_animation.webp
          if [ -s "$DRAWING" ] && [ -s "$ANIMATION" ]; then
            DRAWING_SIZE=$(stat -c%s "$DRAWING")
            ANIMATION_SIZE=$(stat -c%s "$ANIMATION")
            echo "VELYNTORA_START_ART=complete" >> "$GITHUB_ENV"
            echo "✓ Ilustraciones Dibujo y Animación incluidas."
            echo "  Dibujo: $DRAWING_SIZE bytes"
            echo "  Animación: $ANIMATION_SIZE bytes"
          else
            echo "VELYNTORA_START_ART=pending" >> "$GITHUB_ENV"
            echo "::notice::Las ilustraciones de inicio aún no están incluidas o están vacías."
          fi
      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Velyntora-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-dev-apk
          path: Velyntora-dev.apk
      - name: Publicar APK en Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest >/dev/null 2>&1 || gh release create dev-latest --title "Velyntora - APK de prueba" --notes "Compilación de desarrollo para probar el avance actual de Velyntora en Android." --prerelease
          gh release upload dev-latest Velyntora-dev.apk --clobber
